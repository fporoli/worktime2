name: Deploy test environment

# Builds the backend/frontend images and pushes them to ghcr.io (this repo is public, so no
# registry credentials are needed on the VPS side to pull them - see README), then SSHes into
# the VPS and runs docker-compose.test.yml with "pull && up -d". The VPS never builds
# anything itself, it only pulls prebuilt images and restarts containers.
#
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key whose public half is in
# that user's ~/.ssh/authorized_keys on the VPS), and optionally VPS_SSH_PORT (defaults to 22).
on:
  push:
    branches:
      - test
  workflow_dispatch: {}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:test

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:test
          build-args: |
            VITE_API_BASE_URL=https://api.test.turbotapir.com
            VITE_KEYCLOAK_URL=https://auth.test.turbotapir.com
            VITE_KEYCLOAK_REALM=worktime
            VITE_KEYCLOAK_CLIENT_ID=worktime-frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_SSH_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/worktime2
            git pull --ff-only
            docker compose -f docker-compose.test.yml pull
            docker compose -f docker-compose.test.yml up -d --remove-orphans
            docker image prune -f
          '
