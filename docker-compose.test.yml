# Test environment 3: full production-style stack served over HTTPS at test.turbotapir.com /
# api.test.turbotapir.com / auth.test.turbotapir.com via Caddy's automatic Let's Encrypt.
# Deployed by .github/workflows/deploy-test.yml: it builds the backend/frontend images and
# pushes them to ghcr.io, then SSHes into the VPS and runs this file with "pull && up -d" - the
# VPS only ever pulls prebuilt images, it never builds anything itself. keycloak-config-cli
# still runs from the checked-out repo's ./keycloak/realm-config (the VPS has a git clone of
# this repo for the compose/Caddy/postgres-init files anyway - see README).
#
# Internal container ports (300N/800N scheme, matching every other environment) are not
# publicly visible here - Caddy is the only thing exposed (80/443), and reverse-proxies each
# subdomain to the right internal container:port.
name: worktime2-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: 5433
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pgdata/test:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5433/${POSTGRES_DB}?currentSchema=auth
      KC_DB_SCHEMA: auth
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: auth.test.turbotapir.com
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8083
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:latest-26.0.5
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8083
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 60s
      IMPORT_FILES_LOCATIONS: /config/*.yaml
      IMPORT_VAR_SUBSTITUTION_ENABLED: "true"
      FRONTEND_ORIGIN: https://test.turbotapir.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    volumes:
      - ./keycloak/realm-config:/config:ro
    restart: "no"

  backend:
    image: ghcr.io/fporoli/worktime2-backend:test
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5433/${POSTGRES_DB}
      DATABASE_SCHEMA: app
      KEYCLOAK_ISSUER_URL: https://auth.test.turbotapir.com/realms/worktime
      KEYCLOAK_INTERNAL_ISSUER_URL: http://keycloak:8083/realms/worktime
      FRONTEND_ORIGIN: https://test.turbotapir.com
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config-cli:
        condition: service_completed_successfully
    # Prod image's own CMD is just "node dist/src/main.js" (fast, no ts-node) - migrations
    # are run once here at container start instead, same reasoning as azure/deploy.sh's
    # separate migration step, just inline since there's no Container-Apps-job equivalent
    # in plain docker compose.
    command: sh -c "npm run migration:run && npm run seed && node dist/src/main.js"

  frontend:
    image: ghcr.io/fporoli/worktime2-frontend:test
    environment:
      FRONTEND_PORT: 8003
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile.test:/etc/caddy/Caddyfile:ro
      - caddy_test_data:/data
      - caddy_test_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  caddy_test_data:
  caddy_test_config:
