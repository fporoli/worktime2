name: worktime2
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: ${POSTGRES_PORT}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pgdata/dev:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=auth
      KC_DB_SCHEMA: auth
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: ${KEYCLOAK_PORT}
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    expose:
      - "${KEYCLOAK_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:latest-26.0.5
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:${KEYCLOAK_PORT}
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 60s
      IMPORT_FILES_LOCATIONS: /config/*.yaml
      IMPORT_VAR_SUBSTITUTION_ENABLED: "true"
      FRONTEND_ORIGIN: https://localhost:${FRONTEND_PORT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
    volumes:
      - ./keycloak/realm-config:/config:ro
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    expose:
      - "${BACKEND_PORT}"
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      DATABASE_SCHEMA: app
      KEYCLOAK_ISSUER_URL: https://localhost:${KEYCLOAK_PORT}/realms/worktime
      KEYCLOAK_INTERNAL_ISSUER_URL: http://keycloak:${KEYCLOAK_PORT}/realms/worktime
      FRONTEND_ORIGIN: https://localhost:${FRONTEND_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config-cli:
        condition: service_completed_successfully
    command: sh -c "npm run migration:run && npm run seed && npm run start:dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "${FRONTEND_PORT}"
    environment:
      PORT: ${FRONTEND_PORT}
      VITE_API_BASE_URL: https://localhost:${BACKEND_PORT}
      VITE_KEYCLOAK_URL: https://localhost:${KEYCLOAK_PORT}
      VITE_KEYCLOAK_REALM: worktime
      VITE_KEYCLOAK_CLIENT_ID: worktime-frontend
    command: npm run dev -- --host
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT}
      BACKEND_PORT: ${BACKEND_PORT}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
      - "${BACKEND_PORT}:${BACKEND_PORT}"
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  backend_node_modules:
  frontend_node_modules:
