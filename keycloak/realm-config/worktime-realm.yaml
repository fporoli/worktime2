realm: worktime
enabled: true
registrationAllowed: true
registrationEmailAsUsername: true
resetPasswordAllowed: true
verifyEmail: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false
rememberMe: true
bruteForceProtected: true

smtpServer:
  host: mailpit
  port: "1025"
  from: noreply@worktime.local
  fromDisplayName: Worktime
  auth: "false"
  starttls: "false"

# Demo/fixture accounts. backend/src/seed.ts looks these up by email in Postgres (auth.user_entity)
# to link the matching app_user row - keycloak-config-cli assigns its own id at creation time,
# so the two are not correlated by a shared fixed id.
users:
  - username: alice@example.com
    email: alice@example.com
    firstName: Alice
    lastName: Example
    enabled: true
    emailVerified: true
    credentials:
      - type: password
        value: change-me
        temporary: false
  - username: bob@example.com
    email: bob@example.com
    firstName: Bob
    lastName: Example
    enabled: true
    emailVerified: true
    credentials:
      - type: password
        value: change-me
        temporary: false
  - username: james@example.com
    email: james@example.com
    firstName: James
    lastName: Example
    enabled: true
    emailVerified: true
    credentials:
      - type: password
        value: change-me
        temporary: false

clients:
  - clientId: worktime-frontend
    name: Worktime Frontend
    enabled: true
    publicClient: true
    protocol: openid-connect
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - "$(FRONTEND_ORIGIN)/*"
    webOrigins:
      - "$(FRONTEND_ORIGIN)"
    attributes:
      "pkce.code.challenge.method": "S256"
      "post.logout.redirect.uris": "$(FRONTEND_ORIGIN)/*"
